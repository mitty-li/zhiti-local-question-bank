name: Math and recognition regression
on:
  push:
    branches: [fix/math-contract-recognition-20260913]
  pull_request:
    paths:
      - 'app/answer-studio/**'
      - 'app/api/answer-studio/**'
      - 'lib/**'
      - 'tests/**'
      - 'scripts/test-studio.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: math-recognition-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:studio
      - run: npm run benchmark:studio
      - run: npm test
