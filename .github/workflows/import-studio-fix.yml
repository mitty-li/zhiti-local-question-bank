name: Import verified Studio fix
on:
  push:
    branches: [fix/math-contract-recognition-20260913]
    paths: [.github/workflows/import-studio-fix.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'mitty-li/zhiti-local-question-bank' && github.ref == 'refs/heads/fix/math-contract-recognition-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 7
      - name: Verify exact patch and expected ancestry
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = b90b2d966881dc5b3c3d3dbbf43db04414f4a952
          test "$(git rev-parse HEAD~5)" = da8ece9b1c7db7084e6bf5c0bdc39697b5e9df8d
          python - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = ''.join(Path(f'.ci/studio-fix.part{i}.b64').read_text() for i in range(1, 5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 104782, 'Unexpected patch size'
          assert hashlib.sha256(patch).hexdigest() == '203e5823155399b4d029dbf65b13d347ce2fd0b0eff50ebcf459dd8bfd144840', 'Patch checksum mismatch'
          Path(os.environ['RUNNER_TEMP'], 'studio-fix.patch').write_bytes(patch)
          PY
          git apply --check --index --unidiff-zero "$RUNNER_TEMP/studio-fix.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/studio-fix.patch"
          git rm .ci/studio-fix.part1.b64 .ci/studio-fix.part2.b64 .ci/studio-fix.part3.b64 .ci/studio-fix.part4.b64
          git diff --cached --check
      - name: Commit verified source without rewriting history
        id: publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: unify math contract and optimize recognition pipeline'
          git push origin HEAD:refs/heads/fix/math-contract-recognition-20260913
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  regression:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:studio
      - run: npm run benchmark:studio
      - run: npm test
  browser:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: node scripts/build-studio-browser.mjs .studio-browser-test
      - run: python scripts/verify-studio-browser.py .studio-browser-test --out studio-browser-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-results
          path: studio-browser-results
          if-no-files-found: ignore
          retention-days: 7
